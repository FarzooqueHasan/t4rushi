<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Black Hole Orientation Test</title>
  <style>
    body { margin: 0; background: #05060B; overflow: hidden; }
    #canvas-container { width: 100vw; height: 100vh; }
    #hud {
      position: fixed;
      top: 1.5rem;
      left: 1.5rem;
      color: #F4F1EA;
      font-family: sans-serif;
      font-size: 0.85rem;
      background: rgba(5,6,11,0.85);
      padding: 0.85rem 1.25rem;
      border: 1px solid #FF8A3D;
      border-radius: 6px;
      z-index: 10;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/GLTFLoader.js"></script>
</head>
<body>
  <div id="hud">Loading Black Hole...</div>
  <div id="canvas-container"></div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const rotX = parseFloat(urlParams.get('rotX') || '0');
    const rotY = parseFloat(urlParams.get('rotY') || '0');
    const rotZ = parseFloat(urlParams.get('rotZ') || '0');

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05060B);

    // Exact Beat 1 camera position: (0, 10, 85) looking at (0, 0, 0), fov 55
    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 50000);
    camera.position.set(0, 10, 85);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    const ambLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambLight);

    const loader = new THREE.GLTFLoader();
    loader.load('models/blackhole/scene.gltf', function (gltf) {
      const root = gltf.scene;

      // 1. Exclude Planet node entirely
      const toRemove = [];
      root.traverse(child => {
        if (child.name === 'Planet' || (child.name && child.name.startsWith('Planet_'))) {
          toRemove.push(child);
        }
      });
      toRemove.forEach(node => {
        if (node.parent) node.parent.remove(node);
      });

      // 2. Measure bounding box of kept node groups ('black hole' and 'black hole_ring')
      const rawBox = new THREE.Box3().setFromObject(root);
      const rawCenter = new THREE.Vector3();
      rawBox.getCenter(rawCenter);
      const rawSize = new THREE.Vector3();
      rawBox.getSize(rawSize);

      // 3. Center on local origin
      root.position.sub(rawCenter);

      const wrapper = new THREE.Group();
      wrapper.name = "black_hole_wrapper";
      wrapper.add(root);

      // 4. Scale uniformly so widest span becomes exactly 55 world units
      const widestSpan = Math.max(rawSize.x, rawSize.y, rawSize.z);
      const targetSpan = 55.0;
      const scaleFactor = targetSpan / widestSpan;
      wrapper.scale.setScalar(scaleFactor);

      // Optional test rotation
      if (rotX !== 0 || rotY !== 0 || rotZ !== 0) {
        wrapper.rotation.set(rotX, rotY, rotZ);
      }

      scene.add(wrapper);

      renderer.render(scene, camera);

      const finalBox = new THREE.Box3().setFromObject(wrapper);
      const finalSize = new THREE.Vector3();
      finalBox.getSize(finalSize);

      document.getElementById('hud').innerHTML = 
        `Raw Kept Size: [${rawSize.x.toFixed(1)}, ${rawSize.y.toFixed(1)}, ${rawSize.z.toFixed(1)}]<br>` +
        `Widest Span: ${widestSpan.toFixed(1)}<br>` +
        `Scale Factor: ${scaleFactor.toFixed(6)}<br>` +
        `Final Bounds: [${finalSize.x.toFixed(2)}, ${finalSize.y.toFixed(2)}, ${finalSize.z.toFixed(2)}]<br>` +
        `Planet Node Excluded: ${toRemove.length > 0 && !scene.getObjectByName('Planet')}`;

      window.testReady = true;
      window.testData = {
        rawSize: { x: rawSize.x, y: rawSize.y, z: rawSize.z },
        widestSpan: widestSpan,
        scaleFactor: scaleFactor,
        finalSize: { x: finalSize.x, y: finalSize.y, z: finalSize.z },
        planetExcluded: toRemove.length > 0 && !scene.getObjectByName('Planet')
      };
    });
  </script>
</body>
</html>
