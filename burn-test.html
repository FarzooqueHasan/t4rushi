<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2B — Burn / Dissolve Shader</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #05060B;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    /* Temporary trigger button for isolated testing only (does not ship) */
    #test-trigger-btn {
      position: fixed;
      top: 1.5rem;
      left: 1.5rem;
      z-index: 100;
      background: rgba(255, 138, 61, 0.15);
      color: #F4F1EA;
      border: 1px solid #FF8A3D;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s ease;
    }
    #test-trigger-btn:hover {
      opacity: 1;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <!-- Temporary test trigger -->
  <button id="test-trigger-btn">Trigger Burn (Spacebar)</button>
  <div id="canvas-container"></div>

  <script>
    (function () {
      'use strict';

      const container = document.getElementById('canvas-container');
      const triggerBtn = document.getElementById('test-trigger-btn');

      // 1. Scene & Orthographic Camera for Full-Screen Quad
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x05060B);

      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x05060B, 1.0);
      container.appendChild(renderer.domElement);

      // 2. Vertex & Fragment Shader for Noise Dissolve Quad
      const vertexShader = `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position, 1.0);
        }
      `;

      const fragmentShader = `
        precision highp float;
        varying vec2 vUv;
        uniform float u_progress;
        uniform vec3 u_color;
        uniform float u_edgeWidth;
        uniform vec2 u_resolution;

        // 2D Simplex Noise
        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

        float snoise(vec2 v) {
          const vec4 C = vec4(0.211324865405187,
                              0.366025403784439,
                             -0.577350269189626,
                              0.024390243902439);
          vec2 i  = floor(v + dot(v, C.yy) );
          vec2 x0 = v -   i + dot(i, C.xx);
          vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
          vec4 x12 = x0.xyxy + C.xxzz;
          x12.xy -= i1;
          i = mod289(i);
          vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 ))
                + i.x + vec3(0.0, i1.x, 1.0 ));
          vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
          m = m*m;
          m = m*m;
          vec3 x = 2.0 * fract(p * C.www) - 1.0;
          vec3 h = abs(x) - 0.5;
          vec3 ox = floor(x + 0.5);
          vec3 a0 = x - ox;
          m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
          vec3 g;
          g.x  = a0.x  * x0.x  + h.x  * x0.y;
          g.yz = a0.yz * x12.xz + h.yz * x12.yw;
          return 130.0 * dot(m, g);
        }

        float fbm(vec2 uv) {
          float total = 0.0;
          float amp = 0.5;
          for (int i = 0; i < 4; i++) {
            total += snoise(uv) * amp;
            uv *= 2.08;
            amp *= 0.5;
          }
          return total * 0.5 + 0.5;
        }

        void main() {
          vec2 aspectUv = vUv;
          aspectUv.x *= (u_resolution.x / u_resolution.y);

          float n = fbm(aspectUv * 5.5);

          // Threshold stretches slightly beyond 1.0 so edge finishes completely
          float threshold = u_progress * (1.0 + u_edgeWidth);
          float diff = n - threshold;

          // Dissolved pixels discarded to reveal #05060B background beneath
          if (diff < 0.0) {
            discard;
          }

          vec3 col = u_color;
          if (diff < u_edgeWidth) {
            float rim = 1.0 - (diff / u_edgeWidth);
            // Addendum: 1.4-1.6x intensity, red-biased over green, blue suppressed
            // Rim stays visibly hot amber-orange (#FFAE42 / #FF9533), never clips to pale cream
            float boost = rim * 1.5;
            col.r = min(1.0, u_color.r * (1.0 + boost * 0.5));
            col.g = min(0.68, u_color.g * (1.0 + boost * 0.25));
            col.b = u_color.b * (1.0 + boost * 0.05);
          }

          gl_FragColor = vec4(col, 1.0);
        }
      `;

      // Color #FF8A3D in normalized linear space: (1.0, 0.541, 0.239)
      const burnMaterial = new THREE.ShaderMaterial({
        vertexShader: vertexShader,
        fragmentShader: fragmentShader,
        uniforms: {
          u_progress: { value: 0.0 },
          u_color: { value: new THREE.Vector3(1.0, 0.541, 0.239) },
          u_edgeWidth: { value: 0.05 },
          u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
        },
        transparent: true,
        depthWrite: false
      });

      const quadGeo = new THREE.PlaneGeometry(2, 2);
      const quadMesh = new THREE.Mesh(quadGeo, burnMaterial);
      scene.add(quadMesh);

      // 3. Animation Timing: Exactly 800ms
      const BURN_DURATION = 800; // ms
      let isBurning = false;
      let burnStartTime = 0;

      function render() {
        renderer.render(scene, camera);
      }

      function triggerBurn(callback) {
        if (isBurning) return;
        isBurning = true;
        burnStartTime = performance.now();
        burnMaterial.uniforms.u_progress.value = 0.0;

        function step(now) {
          const elapsed = now - burnStartTime;
          const p = Math.min(1.0, elapsed / BURN_DURATION);
          burnMaterial.uniforms.u_progress.value = p;
          render();

          if (p < 1.0) {
            requestAnimationFrame(step);
          } else {
            isBurning = false;
            const totalElapsed = performance.now() - burnStartTime;
            console.log("burn-complete. measured duration: " + totalElapsed.toFixed(1) + "ms");
            if (callback) callback(totalElapsed);
          }
        }

        requestAnimationFrame(step);
      }

      function setProgress(p) {
        burnMaterial.uniforms.u_progress.value = Math.max(0, Math.min(1, p));
        render();
      }

      // Event listeners for trigger
      triggerBtn.addEventListener('click', () => triggerBurn());
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          triggerBurn();
        }
      });

      window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        burnMaterial.uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
        render();
      });

      // Expose API for verification
      window.burnTestAPI = {
        triggerBurn: triggerBurn,
        setProgress: setProgress,
        getProgress: () => burnMaterial.uniforms.u_progress.value
      };

      const params = new URLSearchParams(window.location.search);
      const pParam = params.get('p');
      if (pParam !== null) {
        setProgress(parseFloat(pParam));
      } else {
        render();
      }
    })();
  </script>
</body>
</html>
