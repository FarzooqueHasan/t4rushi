<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tarushi Birthday — 3D Motion Sequence</title>

  <!-- Fredoka Google Font for Kawaii Prank Layer -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" rel="stylesheet">

  <!-- Lenis CSS -->
  <link rel="stylesheet" href="https://unpkg.com/lenis@1.1.18/dist/lenis.css">

  <link rel="icon" href="data:,">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- Part 1 — The Prank Layer (Full-Viewport Overlay sitting in front on page load) -->
  <div id="prank-layer" class="prank-layer">
    <!-- Prank Content Wrapper (receives grayscale filter on hold complete) -->
    <div id="prank-content" class="prank-content">
      <!-- Original Mascot Shape: Rounded Bow in #FF5C8A with #2B1420 details -->
      <div class="prank-mascot-wrap">
        <svg class="prank-mascot-svg" viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg">
          <!-- Left Bow Loop -->
          <path d="M 80 55 C 50 18, 10 28, 20 58 C 30 88, 70 72, 80 55 Z" fill="#FF5C8A" stroke="#2B1420"
            stroke-width="4" stroke-linejoin="round" />
          <!-- Right Bow Loop -->
          <path d="M 80 55 C 110 18, 150 28, 140 58 C 130 88, 90 72, 80 55 Z" fill="#FF5C8A" stroke="#2B1420"
            stroke-width="4" stroke-linejoin="round" />
          <!-- Left Hanging Ribbon -->
          <path d="M 72 60 C 60 82, 45 102, 35 108 C 50 98, 65 92, 75 70 Z" fill="#FF5C8A" stroke="#2B1420"
            stroke-width="3" stroke-linejoin="round" />
          <!-- Right Hanging Ribbon -->
          <path d="M 88 60 C 100 82, 115 102, 125 108 C 110 98, 95 92, 85 70 Z" fill="#FF5C8A" stroke="#2B1420"
            stroke-width="3" stroke-linejoin="round" />
          <!-- Center Knot -->
          <circle cx="80" cy="55" r="15" fill="#FF5C8A" stroke="#2B1420" stroke-width="4" />
          <!-- Knot Highlight -->
          <circle cx="76" cy="51" r="3.5" fill="#FFD1E8" />
        </svg>
      </div>

      <!-- Heading: centered top third, Fredoka 600 -->
      <h1 class="prank-heading">tarushi's cute corner ✨</h1>

      <!-- Fake Visitor Counter -->
      <div class="prank-counter">you are visitor #000001 ~☆</div>

      <!-- Fake Guestbook Button with Tooltip -->
      <div class="prank-guestbook-wrap">
        <button class="prank-guestbook-btn" id="guestbook-btn" type="button">sign guestbook ♡</button>
        <div class="prank-tooltip" id="guestbook-tooltip">aw thanks!</div>
      </div>

      <!-- 2A Hold-to-Proceed Button: Unmodified #FF8A3D / #F4F1EA colors, label updated -->
      <div class="hold-container" id="hold-btn">
        <div class="ring-wrapper">
          <svg class="ring-svg" viewBox="0 0 120 120">
            <circle class="ring-bg" cx="60" cy="60" r="50" />
            <circle class="ring-fill" id="ring-progress" cx="60" cy="60" r="50" />
          </svg>
          <div class="flash-overlay" id="flash-overlay"></div>
        </div>
        <span class="hold-label">HOLD FOR SURPRISE</span>
      </div>

      <!-- Step 3: Punchline Centered Text -->
      <div class="punchline-overlay" id="punchline-text">
        did you really think my skills are this bad?
      </div>
    </div>

    <!-- 2B Burn/Dissolve Shader Canvas (sibling to #prank-content, immune to grayscale filter) -->
    <canvas id="burn-canvas"></canvas>
  </div>

  <!-- Persistent 3D Camera Rig WebGL Canvas (Behind the Prank Layer) -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Scroll Anchor Sections (empty, scroll-anchoring only) -->
  <main id="scroll-container">
    <section class="chapter-section" id="beat-1"></section>
    <section class="chapter-section" id="beat-2"></section>
    <section class="chapter-section" id="beat-3"></section>
    <section class="chapter-section" id="beat-4"></section>
    <section class="chapter-section" id="beat-5"></section>
    <section class="chapter-section" id="beat-6"></section>
    <section class="chapter-section" id="beat-7"></section>
    <section class="chapter-section" id="beat-8"></section>
  </main>

  <!-- Beat 1 Caption Overlay (DOM text overlay on top of WebGL canvas) -->
  <div id="beat1-caption-overlay" class="beat1-caption-overlay" aria-live="polite">
    <p id="beat1-caption" class="beat1-caption">some people just pull everything toward them.</p>
  </div>

  <!-- Beat 2 / Beat 3 Handoff Flash Overlay (Full-viewport DOM overlay, #F4F1EA) -->
  <div id="flash-handoff-overlay" class="flash-handoff-overlay" aria-hidden="true"></div>

  <!-- Beat 7 Name Reveal Overlay (DOM text overlay on top of WebGL canvas) -->
  <div id="name-reveal-overlay" class="name-reveal-overlay">
    <!-- Stage 1: Φ -->
    <div class="reveal-stage" id="reveal-stage-1">
      <div class="reveal-word-wrap">
        <span class="reveal-word">Φ</span>
        <div class="reveal-strikethrough" id="reveal-strike-1"></div>
      </div>
      <p class="reveal-caption">what my phone thinks your name is.</p>
    </div>

    <!-- Stage 2: taNushi -->
    <div class="reveal-stage" id="reveal-stage-2">
      <div class="reveal-word-wrap">
        <span class="reveal-word">taNushi</span>
        <div class="reveal-strikethrough" id="reveal-strike-2"></div>
      </div>
      <p class="reveal-caption">still wrong.</p>
    </div>

    <!-- Stage 3: Tarushi -->
    <div class="reveal-stage" id="reveal-stage-3">
      <div class="reveal-word-wrap">
        <span class="reveal-word" id="reveal-word-tarushi">Tarushi</span>
      </div>
      <p class="reveal-caption">there she is.</p>
    </div>

    <!-- Stage 4: Happy Birthday -->
    <div class="reveal-stage" id="reveal-stage-4">
      <div class="reveal-word-wrap">
        <h2 class="reveal-birthday">Happy Birthday</h2>
      </div>
    </div>
  </div>

  <!-- Beat 8 / ScrapBook Handoff Overlay (Full-viewport DOM overlay, #EFE6D2) -->
  <div id="scrapbook-handoff-overlay" class="scrapbook-handoff-overlay" aria-hidden="true"></div>

  <!-- Core Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/OBJLoader.js"></script>
  <script src="js/GLTFLoader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>

  <!-- Task 7 Name Reveal Logic -->
  <script src="js/name-reveal.js"></script>

  <!-- Task 1 Camera Rig, Task 4 B2 Bomber & Task 5 Fighter Jet -->
  <script src="js/main.js"></script>

  <!-- Task 3 Prank Layer Logic -->
  <script src="js/prank.js"></script>
</body>

</html>
