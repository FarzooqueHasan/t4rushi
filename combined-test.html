<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2A + 2B Combined Handoff Test</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #05060B;
      color: #F4F1EA;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }
    .hold-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      pointer-events: auto;
    }
    .hold-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      cursor: pointer;
      touch-action: none;
    }
    .ring-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ring-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    .ring-bg {
      fill: none;
      stroke: #05060B;
      stroke-width: 2.5px;
      opacity: 0.6;
    }
    .ring-fill {
      fill: none;
      stroke: #05060B;
      stroke-width: 5px;
      stroke-linecap: round;
      stroke-dasharray: 339.292;
      stroke-dashoffset: 339.292;
    }
    .flash-overlay {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 108px;
      height: 108px;
      border-radius: 50%;
      background: #FFFFFF;
      opacity: 0;
      pointer-events: none;
    }
    .hold-label {
      color: #05060B;
      font-size: 0.95rem;
      letter-spacing: 0.2em;
      font-weight: 700;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <!-- 2B WebGL Canvas (Dissolving #FF8A3D plane over #05060B background) -->
  <div id="canvas-container"></div>

  <!-- 2A Hold-to-proceed UI -->
  <div class="hold-layer" id="hold-layer">
    <div class="hold-container" id="hold-btn">
      <div class="ring-wrapper">
        <svg class="ring-svg" viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="54" />
          <circle class="ring-fill" id="ring-progress" cx="60" cy="60" r="54" />
        </svg>
        <div class="flash-overlay" id="flash-overlay"></div>
      </div>
      <span class="hold-label" id="hold-label">HOLD</span>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // ----------------------------------------------------------------------
      // 1. Setup 2B: WebGL Burn/Dissolve Shader
      // ----------------------------------------------------------------------
      const container = document.getElementById('canvas-container');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x05060B);

      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x05060B, 1.0);
      container.appendChild(renderer.domElement);

      const vertexShader = `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position, 1.0);
        }
      `;

      const fragmentShader = `
        precision highp float;
        varying vec2 vUv;
        uniform float u_progress;
        uniform vec3 u_color;
        uniform float u_edgeWidth;
        uniform vec2 u_resolution;

        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

        float snoise(vec2 v) {
          const vec4 C = vec4(0.211324865405187,
                              0.366025403784439,
                             -0.577350269189626,
                              0.024390243902439);
          vec2 i  = floor(v + dot(v, C.yy) );
          vec2 x0 = v -   i + dot(i, C.xx);
          vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
          vec4 x12 = x0.xyxy + C.xxzz;
          x12.xy -= i1;
          i = mod289(i);
          vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 ))
                + i.x + vec3(0.0, i1.x, 1.0 ));
          vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
          m = m*m;
          m = m*m;
          vec3 x = 2.0 * fract(p * C.www) - 1.0;
          vec3 h = abs(x) - 0.5;
          vec3 ox = floor(x + 0.5);
          vec3 a0 = x - ox;
          m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
          vec3 g;
          g.x  = a0.x  * x0.x  + h.x  * x0.y;
          g.yz = a0.yz * x12.xz + h.yz * x12.yw;
          return 130.0 * dot(m, g);
        }

        float fbm(vec2 uv) {
          float total = 0.0;
          float amp = 0.5;
          for (int i = 0; i < 4; i++) {
            total += snoise(uv) * amp;
            uv *= 2.08;
            amp *= 0.5;
          }
          return total * 0.5 + 0.5;
        }

        void main() {
          vec2 aspectUv = vUv;
          aspectUv.x *= (u_resolution.x / u_resolution.y);

          float n = fbm(aspectUv * 5.5);

          float threshold = u_progress * (1.0 + u_edgeWidth);
          float diff = n - threshold;

          if (diff < 0.0) {
            discard;
          }

          vec3 col = u_color;
          if (diff < u_edgeWidth) {
            float rim = 1.0 - (diff / u_edgeWidth);
            float boost = rim * 1.5;
            col.r = min(1.0, u_color.r * (1.0 + boost * 0.5));
            col.g = min(0.68, u_color.g * (1.0 + boost * 0.25));
            col.b = u_color.b * (1.0 + boost * 0.05);
          }

          gl_FragColor = vec4(col, 1.0);
        }
      `;

      const burnMaterial = new THREE.ShaderMaterial({
        vertexShader: vertexShader,
        fragmentShader: fragmentShader,
        uniforms: {
          u_progress: { value: 0.0 },
          u_color: { value: new THREE.Vector3(1.0, 0.541, 0.239) },
          u_edgeWidth: { value: 0.05 },
          u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
        },
        transparent: true,
        depthWrite: false
      });

      const quadMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), burnMaterial);
      scene.add(quadMesh);

      function render() {
        renderer.render(scene, camera);
      }
      render();

      window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        burnMaterial.uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
        render();
      });

      // Burn animation: exactly 800ms
      const BURN_DURATION = 800; // ms
      function triggerBurn() {
        const burnStartTime = performance.now();

        function step(now) {
          const elapsed = now - burnStartTime;
          const p = Math.min(1.0, elapsed / BURN_DURATION);
          burnMaterial.uniforms.u_progress.value = p;
          render();

          if (p < 1.0) {
            requestAnimationFrame(step);
          } else {
            const totalElapsed = performance.now() - burnStartTime;
            console.log("burn-complete. measured duration: " + totalElapsed.toFixed(1) + "ms");
          }
        }

        requestAnimationFrame(step);
      }

      // ----------------------------------------------------------------------
      // 2. Setup 2A: Hold-to-Proceed Gesture
      // ----------------------------------------------------------------------
      const holdBtn = document.getElementById('hold-btn');
      const holdLayer = document.getElementById('hold-layer');
      const ringProgress = document.getElementById('ring-progress');
      const flashOverlay = document.getElementById('flash-overlay');

      const CIRCUMFERENCE = 2 * Math.PI * 54;
      const HOLD_DURATION = 1200; // ms
      const RELEASE_DURATION = 300; // ms

      let isHolding = false;
      let holdStartTime = 0;
      let currentProgress = 0;
      let hasCompleted = false;
      let releaseStartTime = 0;
      let releaseStartProgress = 0;
      let rafId = null;

      function setProgress(p) {
        currentProgress = Math.max(0, Math.min(1, p));
        ringProgress.style.strokeDashoffset = CIRCUMFERENCE * (1 - currentProgress);
      }

      function update(now) {
        if (isHolding && !hasCompleted) {
          const elapsed = now - holdStartTime;
          const p = elapsed / HOLD_DURATION;

          if (p >= 1.0) {
            setProgress(1.0);
            hasCompleted = true;
            isHolding = false;

            // Log exactly once per hold
            console.log("hold-complete");

            // Dispatch event
            const event = new CustomEvent('hold-complete', { bubbles: true });
            holdBtn.dispatchEvent(event);

            // Completion flash then remove hold layer
            flashOverlay.style.opacity = '1';
            setTimeout(() => {
              holdLayer.style.display = 'none';
            }, 80);
            return;
          } else {
            setProgress(p);
            rafId = requestAnimationFrame(update);
          }
        } else if (!isHolding && currentProgress > 0 && !hasCompleted) {
          const elapsed = now - releaseStartTime;
          const releaseProgress = Math.min(1.0, elapsed / RELEASE_DURATION);
          const p = releaseStartProgress * (1 - releaseProgress);
          setProgress(p);

          if (releaseProgress < 1.0) {
            rafId = requestAnimationFrame(update);
          } else {
            setProgress(0);
          }
        }
      }

      function onPointerDown(e) {
        if (hasCompleted) return;
        try { holdBtn.setPointerCapture(e.pointerId); } catch (_) {}
        isHolding = true;
        holdStartTime = performance.now() - (currentProgress * HOLD_DURATION);
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(update);
      }

      function onPointerUp(e) {
        if (!isHolding || hasCompleted) return;
        try { holdBtn.releasePointerCapture(e.pointerId); } catch (_) {}
        isHolding = false;
        releaseStartTime = performance.now();
        releaseStartProgress = currentProgress;
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(update);
      }

      holdBtn.addEventListener('pointerdown', onPointerDown);
      holdBtn.addEventListener('pointerup', onPointerUp);
      holdBtn.addEventListener('pointercancel', onPointerUp);
      holdBtn.addEventListener('pointerleave', onPointerUp);

      // ----------------------------------------------------------------------
      // 3. Combined Wiring: Hold-Complete -> Burn Trigger Immediately
      // ----------------------------------------------------------------------
      holdBtn.addEventListener('hold-complete', () => {
        // Hold completes, burn plays immediately, no gap, no second confirmation step
        triggerBurn();
      });

      // API for programmatic verification
      window.combinedTestAPI = {
        simulateHoldToComplete: (callback) => {
          onPointerDown({ pointerId: 1 });
          setTimeout(() => {
            if (callback) callback();
          }, 1250);
        }
      };

      setProgress(0);
    })();
  </script>
</body>
</html>
