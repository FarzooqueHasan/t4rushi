<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formation Escorts — Orientation & Normalization Test</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #05060B;
      color: #F4F1EA;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #hud {
      position: fixed;
      top: 1.5rem;
      left: 1.5rem;
      z-index: 10;
      background: rgba(5, 6, 11, 0.88);
      border: 1px solid rgba(255, 138, 61, 0.4);
      border-radius: 6px;
      padding: 0.85rem 1.25rem;
      font-size: 0.85rem;
      line-height: 1.5;
      pointer-events: none;
    }
    .hud-title {
      color: #FF8A3D;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.35rem;
    }
    .hud-stat {
      color: #F4F1EA;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/GLTFLoader.js"></script>
</head>
<body>
  <div id="hud">
    <div class="hud-title" id="hud-title">FORMATION ORIENTATION TEST</div>
    <div class="hud-stat" id="hud-info">Loading model...</div>
  </div>
  <div id="canvas-container"></div>

  <script>
    (function () {
      'use strict';

      const container = document.getElementById('canvas-container');
      const hudTitle = document.getElementById('hud-title');
      const hudInfo = document.getElementById('hud-info');

      const urlParams = new URLSearchParams(window.location.search);
      const modelName = urlParams.get('model') || 'f16'; // 'f16' | 'mig35'
      const viewMode = urlParams.get('view') || 'top';    // 'top' | 'side'
      const stage = urlParams.get('stage') || 'raw';       // 'raw' | 'normalized'

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x05060B);

      // Lighting matching project spec
      const dirLight = new THREE.DirectionalLight(0xFF8A3D, 0.6);
      dirLight.position.set(20, 40, 30);
      scene.add(dirLight);

      const ambLight = new THREE.AmbientLight(0xF4F1EA, 0.25);
      scene.add(ambLight);

      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputEncoding = THREE.sRGBEncoding;
      container.appendChild(renderer.domElement);

      const loader = new THREE.GLTFLoader();
      let modelPath = 'models/f16/scene.gltf';
      if (modelName === 'mig35') modelPath = 'models/mig35/scene.gltf';
      if (modelName === 'mig21') modelPath = 'models/mig21/scene.gltf';

      window.modelReady = false;

      loader.load(modelPath, function (gltf) {
        const root = gltf.scene;

        // 1. Material override: discard originals, apply MeshStandardMaterial + EdgesGeometry
        const bodyMaterial = new THREE.MeshStandardMaterial({
          color: 0x05060B,
          roughness: 0.6,
          metalness: 0.1
        });
        const edgeMaterial = new THREE.LineBasicMaterial({
          color: 0xFF8A3D,
          linewidth: 1.5
        });

        const meshes = [];
        root.traverse(child => {
          if (child.isMesh) {
            child.material = bodyMaterial;
            meshes.push(child);
          }
        });

        const thresholdAngle = modelName === 'mig21' ? 45 : 28;

        meshes.forEach(mesh => {
          try {
            const edgesGeom = new THREE.EdgesGeometry(mesh.geometry, thresholdAngle);
            const edgeLine = new THREE.LineSegments(edgesGeom, edgeMaterial);
            mesh.add(edgeLine);
          } catch (e) {
            console.warn('Could not generate edges for mesh', e);
          }
        });

        // 2. Measure raw bounding box
        const rawBox = new THREE.Box3().setFromObject(root);
        const rawCenter = new THREE.Vector3();
        rawBox.getCenter(rawCenter);
        const rawSize = new THREE.Vector3();
        rawBox.getSize(rawSize);

        // Center on local origin
        root.position.sub(rawCenter);

        const wrapper = new THREE.Group();
        wrapper.add(root);
        scene.add(wrapper);

        let wingspan = 0;
        let lengthAxis = '';
        let noseDirection = '';

        if (modelName === 'f16') {
          // F-16 analysis:
          // Raw Size: X=5.83 (wingspan), Y=2.82 (height), Z=9.14 (length)
          lengthAxis = 'Z';
          noseDirection = '-Z';
          
          if (stage === 'normalized') {
            // Nose is already -Z, up is already +Y.
            root.rotation.set(0, 0, 0);

            // Recompute bounding box after centering
            const normBox = new THREE.Box3().setFromObject(root);
            const normSize = new THREE.Vector3();
            normBox.getSize(normSize);

            wingspan = normSize.x;
            const targetWingspan = 17.0;
            const scaleFactor = targetWingspan / wingspan;
            wrapper.scale.setScalar(scaleFactor);
          }
        } else if (modelName === 'mig35') {
          // MiG-35 analysis:
          // Raw Size: X=175.58 (length), Y=49.95 (height), Z=119.97 (wingspan)
          // Nose is at +X, tail at -X, canopy/up is +Y, wings along Z.
          lengthAxis = 'X';
          noseDirection = '+X';

          if (stage === 'normalized') {
            // Rotate around Y by +90deg (Math.PI/2):
            // +X (nose) -> -Z (target nose direction)
            // +Y (up) -> +Y (target up direction)
            // Z (wings) -> X (target wingspan along X)
            root.rotation.y = Math.PI / 2;

            // Recompute bounding box after rotation
            const normBox = new THREE.Box3().setFromObject(root);
            const normSize = new THREE.Vector3();
            normBox.getSize(normSize);

            wingspan = normSize.x; // wings are now along X
            const targetWingspan = 20.0;
            const scaleFactor = targetWingspan / wingspan;
            wrapper.scale.setScalar(scaleFactor);
          }
        } else if (modelName === 'mig21') {
          lengthAxis = 'Z';
          noseDirection = '+Z';

          if (stage === 'normalized') {
            // Rotate around Y by 180 deg (Math.PI):
            // +Z (nose) -> -Z (target nose direction)
            // +Y (up) -> +Y (target up direction)
            // X (wings) -> X (target wingspan along X)
            root.rotation.y = Math.PI;

            // Recompute bounding box after rotation
            const normBox = new THREE.Box3().setFromObject(root);
            const normSize = new THREE.Vector3();
            normBox.getSize(normSize);

            wingspan = normSize.x;
            const targetWingspan = 16.0;
            const scaleFactor = targetWingspan / wingspan;
            wrapper.scale.setScalar(scaleFactor);
          }
        }

        // Axes Helper at origin: Red = +X, Green = +Y, Blue = +Z
        const axes = new THREE.AxesHelper(modelName === 'mig35' && stage === 'raw' ? 100 : 15);
        scene.add(axes);

        // Update bounds of wrapper
        const finalBox = new THREE.Box3().setFromObject(wrapper);
        const finalSize = new THREE.Vector3();
        finalBox.getSize(finalSize);
        const maxDim = Math.max(finalSize.x, finalSize.y, finalSize.z);

        // Setup Orthographic Camera
        const aspect = window.innerWidth / window.innerHeight;
        const frustumSize = maxDim * 1.5;
        const orthoCam = new THREE.OrthographicCamera(
          frustumSize * aspect / -2,
          frustumSize * aspect / 2,
          frustumSize / 2,
          frustumSize / -2,
          0.1,
          5000
        );

        if (viewMode === 'top') {
          // Looking straight down +Y to (0, 0, 0), UP is -Z
          orthoCam.position.set(0, maxDim * 2, 0);
          orthoCam.up.set(0, 0, -1);
          orthoCam.lookAt(0, 0, 0);
        } else if (viewMode === 'side') {
          // Looking from +X towards origin, UP is +Y
          orthoCam.position.set(maxDim * 2, 0, 0);
          orthoCam.up.set(0, 1, 0);
          orthoCam.lookAt(0, 0, 0);
        } else if (viewMode === 'front') {
          // Looking from -Z towards origin, UP is +Y
          orthoCam.position.set(0, 0, -maxDim * 2);
          orthoCam.up.set(0, 1, 0);
          orthoCam.lookAt(0, 0, 0);
        }

        orthoCam.updateProjectionMatrix();

        hudTitle.textContent = `${modelName.toUpperCase()} — ${stage.toUpperCase()} (${viewMode.toUpperCase()} VIEW)`;
        hudInfo.innerHTML = `Raw Size: [${rawSize.x.toFixed(2)}, ${rawSize.y.toFixed(2)}, ${rawSize.z.toFixed(2)}]<br>` +
          `Identified Length Axis: ${lengthAxis}<br>` +
          `Current Bounds: [${finalSize.x.toFixed(2)}, ${finalSize.y.toFixed(2)}, ${finalSize.z.toFixed(2)}]`;

        renderer.render(scene, orthoCam);
        window.modelReady = true;
        window.modelData = {
          rawSize: { x: rawSize.x, y: rawSize.y, z: rawSize.z },
          finalSize: { x: finalSize.x, y: finalSize.y, z: finalSize.z },
          lengthAxis: lengthAxis
        };
      });

      window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    })();
  </script>
</body>
</html>
